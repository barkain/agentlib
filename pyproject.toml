[project]
name = "agentlib"
version = "0.1.0"
description = "Agentic Knowledge Navigation System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "pymupdf>=1.25",
    "ebooklib>=0.18",
    "tiktoken>=0.9",
    "anthropic>=0.52",
    "openai>=1.0",
]

[project.scripts]
benchmark = "benchmark.cli:main"

[project.optional-dependencies]
benchmark = [
    "scipy>=1.12",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[tool.ruff.lint]
select = ["E", "F", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.hatch.build.targets.wheel]
packages = ["lib", "preprocessing", "benchmark"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
